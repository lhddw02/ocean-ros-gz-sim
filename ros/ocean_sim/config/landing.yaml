# Marker dimensions include the outer black border; white margin is additional.
scene:
  tag_family: tag36h11
  tag_id: 0
  tag_size: 0.4
  quiet_margin: 0.1
  station_x: 0.0
  station_y: 0.0
  station_z: 0.15
  drone_x: 0.8
  drone_y: -0.5
  drone_z: 3.0
controller:
  camera_clearance: 0.35
  horizontal_gain: 0.85
  horizontal_limit: 0.55
  alignment_tolerance: 0.12
  alignment_hold: 0.65
  descend_rate: 0.35
  flare_rate: 0.10
  contact_hold: 0.30
  target_timeout: 0.35
